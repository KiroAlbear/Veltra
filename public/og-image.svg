<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#071323"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#39CFA2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#39CFA2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Logo -->
  <rect x="100" y="100" width="64" height="64" rx="14" fill="#39CFA2"/>
  <text x="132" y="148" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="white">V</text>
  <text x="180" y="148" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#F5F1EA">Veltra</text>
  <!-- Headline -->
  <text x="100" y="320" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="56" fill="#A39C8E">The Clinic</text>
  <text x="100" y="390" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="56" fill="#A39C8E">Operating System.</text>
  <!-- Subtitle -->
  <text x="100" y="450" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#A39C8E">Runs your clinic from the first call to the final follow-up.</text>
  <!-- Footer -->
  <text x="100" y="560" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#6B6558" letter-spacing="2">VELTRA TECHNOLOGIES · 2026</text>
</svg>
